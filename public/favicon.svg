<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Garrafa">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="55%" stop-color="#d9e6f2"/>
      <stop offset="100%" stop-color="#b7cfe3"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a86c7"/>
      <stop offset="100%" stop-color="#155a8f"/>
    </linearGradient>
  </defs>
  <!-- handle -->
  <path d="M22 14c0-5 5-9 10-9s10 4 10 9" fill="none" stroke="#155a8f" stroke-width="3.5" stroke-linecap="round"/>
  <!-- valve -->
  <rect x="28" y="10" width="8" height="8" rx="2" fill="#1e78b8"/>
  <rect x="26" y="8" width="12" height="3.5" rx="1.5" fill="#0f2a40"/>
  <!-- collar -->
  <rect x="20" y="18" width="24" height="8" rx="2" fill="url(#collar)"/>
  <!-- body -->
  <path d="M18 26c0-2 2-3 4-3h20c2 0 4 1 4 3v26c0 6-6 11-14 11s-14-5-14-11V26z" fill="url(#body)" stroke="#7aa0bc" stroke-width="1.5"/>
  <!-- highlight -->
  <path d="M24 30c0-1 1-2 2-2h4c1 0 2 1 2 2v16c0 1-1 2-2 2h-4c-1 0-2-1-2-2V30z" fill="#ffffff" opacity="0.45"/>
  <!-- brand band -->
  <rect x="22" y="40" width="20" height="7" rx="1.5" fill="#1e78b8"/>
  <text x="32" y="45.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#ffffff">GAS</text>
</svg>
